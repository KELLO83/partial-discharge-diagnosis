version: 1
jobs:
  - name: timeseries_gru_dry_run
    task: timeseries
    enabled: true
    description: Dry-run a lightweight GRU time-series run for one-command smoke checks.
    args:
      model: gru
      manifest: data/manifest.csv
      artifact-dir: .omo/config-smoke/time_series
      output: .omo/config-smoke/time_series_experiments.csv
      sample-size: 20
      epochs: 1
      dry-run: true

  - name: vision_small_cnn_dry_run
    task: vision
    enabled: true
    description: Validate PRPD image manifest resolution and SmallPrpdCnn output paths.
    args:
      manifest: data/manifest.csv
      output_dir: .omo/config-smoke/vision
      sample_size: 20
      epochs: 1
      batch_size: 8
      dry_run: true

  - name: vlm_smolvlm_dry_run
    task: vlm
    enabled: true
    description: Build a small instruction dataset and validate low-VRAM VLM QLoRA settings.
    args:
      model_profile: smolvlm2_2b_qlora
      manifest: data/manifest.csv
      dataset_output: .omo/config-smoke/vlm/instruction_dataset.jsonl
      output_dir: .omo/config-smoke/vlm
      sample_size: 2
      dry_run: true
