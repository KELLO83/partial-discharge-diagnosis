version: 1
jobs:
  - name: timeseries_gru_baseline
    task: timeseries
    enabled: false
    description: First CSV time-series neural baseline.
    args:
      model: gru
      manifest: data/manifest.csv
      output: artifacts/models/timeseries/experiments.csv
      sample_size: 500
      epochs: 5
      batch_size: 16
      mixed_precision: fp16

  - name: vision_small_cnn_baseline
    task: vision
    enabled: false
    description: First lightweight PRPD image baseline for service checkpoint artifacts.
    args:
      manifest: data/manifest.csv
      output_dir: artifacts/models/vision
      model_name: small_prpd_cnn
      sample_size: 500
      epochs: 5
      batch_size: 16
      learning_rate: 0.001
      device: auto

  - name: vlm_qwen2_5_report_sft
    task: vlm
    enabled: false
    description: Default VLM report generator SFT profile with 4-bit QLoRA.
    args:
      model_profile: qwen2_5_vl_3b_qlora
      manifest: data/manifest.csv
      dataset_output: artifacts/models/vlm/instruction_dataset.jsonl
      output_dir: artifacts/models/vlm
      sample_size: 500
      max_steps: 100
